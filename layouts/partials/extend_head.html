<style>
/* =========================================
   1. color-mix 毛玻璃（绝美自适应颜色）
   ========================================= */
body.list {
    background-image: url('/images/bg.jpg') !important;
    background-size: cover !important;
    background-position: center !important;
    background-attachment: fixed !important;
    background-color: var(--theme) !important;
}

body.list .header {
    background: color-mix(in srgb, var(--theme) 75%, transparent) !important;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
}

.first-entry,
.post-entry {
    background: color-mix(in srgb, var(--entry) 75%, transparent) !important;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid color-mix(in srgb, var(--primary) 15%, transparent) !important;
    border-radius: var(--radius);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
    padding: var(--gap);
    margin-bottom: var(--gap);
}

.post-entry:hover {
    background: color-mix(in srgb, var(--entry) 90%, transparent) !important;
    transform: translateY(-2px);
    transition: transform 0.2s ease, background 0.2s ease;
}

.post-entry .entry-content,
.post-entry .entry-content p,
.post-entry .entry-footer,
.post-entry .entry-footer span {
    color: var(--primary) !important;
}

/* =========================================
   2. PaperMod ToC：点击项文字高亮
   ========================================= */
details.toc a.active,
details.toc a.active:hover {
    color: #3b82f6 !important;
}

/* =========================================
   3. PaperMod ToC：宽屏右侧悬浮
   ========================================= */
@media screen and (min-width: 1280px) {
    details.toc {
        position: fixed;
        top: 100px;
        left: auto;
        right: max(20px, calc(50% - 660px));
        width: 280px;
        box-sizing: border-box;
        max-height: calc(100vh - 140px);
        overflow-y: auto;
        background: color-mix(in srgb, var(--entry) 75%, transparent) !important;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border: 1px solid color-mix(in srgb, var(--primary) 15%, transparent) !important;
        border-radius: var(--radius);
        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
        padding: var(--gap);
        z-index: 99;
    }

    details.toc .inner {
        margin: 0;
        padding: 0;
    }

    details.toc ul {
        font-size: 0.85em;
        padding-left: 15px;
        line-height: 1.8;
    }

    details.toc a:hover {
        color: var(--primary);
        text-decoration: underline;
    }

    details.toc::-webkit-scrollbar {
        width: 4px;
    }

    details.toc::-webkit-scrollbar-track {
        background: transparent;
    }

    details.toc::-webkit-scrollbar-thumb {
        background: color-mix(in srgb, var(--primary) 20%, transparent);
        border-radius: 4px;
    }
}
</style>

<script>
    (() => {
        const initTocTracking = () => {
            const toc = document.querySelector("details.toc");
            const content = document.querySelector(".post-content");

            if (!toc || !content || !("IntersectionObserver" in window)) {
                return;
            }

            const linksById = new Map(
                [...toc.querySelectorAll('a[href^="#"]')].map((link) => [
                    decodeURIComponent(link.getAttribute("href").slice(1)),
                    link,
                ]),
            );
            const headings = [...content.querySelectorAll("h1[id], h2[id], h3[id], h4[id], h5[id], h6[id]")]
                .filter((heading) => linksById.has(heading.id));

            if (!headings.length) {
                return;
            }

            const activate = (link) => {
                toc.querySelectorAll("a.active").forEach((activeLink) => {
                    activeLink.classList.remove("active");
                });
                link?.classList.add("active");
            };

            const markCurrentHeading = () => {
                const readingLine = window.scrollY + window.innerHeight * 0.25;
                const current = headings
                    .filter(
                        (heading) =>
                            heading.getBoundingClientRect().top + window.scrollY <= readingLine,
                    )
                    .at(-1);

                if (current) {
                    activate(linksById.get(current.id));
                }
            };

            const observer = new IntersectionObserver(
                () => markCurrentHeading(),
                {
                    rootMargin: "-20% 0px -65% 0px",
                    threshold: 0,
                },
            );

            headings.forEach((heading) => observer.observe(heading));

            toc.querySelectorAll("a[href^=\"#\"]").forEach((link) => {
                link.addEventListener("click", () => {
                    activate(link);
                });
            });

            markCurrentHeading();
            window.addEventListener("scroll", markCurrentHeading, { passive: true });
        };

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", initTocTracking, { once: true });
        } else {
            initTocTracking();
        }
    })();
</script>
