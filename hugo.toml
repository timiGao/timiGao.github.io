baseURL = 'https://timiGao.github.io/'
languageCode = 'zh-cn'
title = "Timi's Site"
theme = 'PaperMod'

# 开启 HTML 渲染权限（不仅能用来插入头像，也能让文章支持 <details> 折叠框）
[markup.goldmark.renderer]
  unsafe = true

# ================= 顶部导航栏 (Menu) =================
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 20

# ================= 基础参数 (Params) =================
[params]
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true

# ================= 网站图标 (Favicon) =================
[params.assets]
  favicon = "/apple-touch-icon.png"
  apple_touch_icon = "/apple-touch-icon.png"

# ================= 首页顶部信息 (Home Info) =================
[params.homeInfoParams]
  Title = "Hi, 我是 Timi"
  # 利用 HTML 标签强行注入头像，设定宽度为 90px 且裁切为圆形 (border-radius: 50%)
  Content = """
  <img src="/images/avatar.jpg" alt="avatar" width="90" style="border-radius: 50%; margin-bottom: 15px;">
  <br>电子科技大学 CS 学生
  """

# ================= 社交媒体链接 (Social Icons) =================
[[params.socialIcons]]
  name = "github"
  url = "https://github.com/timiGao"

[[params.socialIcons]]
  name = "email"
  url = "mailto:timi.ghm@outlook.com"

[[params.socialIcons]]
  name = "bilibili"
  url = "https://space.bilibili.com/402601923"

[[params.socialIcons]]
  name = "zhihu"
  url = "https://www.zhihu.com/people/ti-mi-19-68"

[[params.socialIcons]]
  name = "douban"
  url = "https://www.douban.com/people/278279045"

[[params.socialIcons]]
  name = "link" # 暂用通用链接图标替代 Bangumi
  url = "https://bgm.tv/user/timi"